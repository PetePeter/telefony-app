[project]
name = "telefony-app"
version = "0.2.2"
description = "PhAP phone service: a PC acting as a Bluetooth hands-free unit, driven by AI agents over PhAP or MCP"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["bumble>=0.0.236", "numpy", "scipy", "websockets>=13", "mcp>=2", "tomlkit"]

[project.optional-dependencies]
stt = ["faster-whisper"]
dev = ["pytest", "pytest-asyncio", "jsonschema", "pyright"]

[project.scripts]
telefony-app = "telefony_app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telefony_app = ["phap/*.json", "web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
