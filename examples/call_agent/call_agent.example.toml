# The demo call agent: a PhAP client of a running telefony-app.

[phap]
uri = "ws://127.0.0.1:7781/phap"
token = "change-me"                       # telefony-app's [phap] token

[llm]                                     # any OpenAI-compatible chat API
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-2.5-flash"
api_key_env = "OPENROUTER_API_KEY"        # the environment variable holding the key
# Local instead: base_url = "http://127.0.0.1:8080/v1", model = "lfm", api_key_env = ""

[weather]                                 # Open-Meteo, free and keyless
latitude = -33.87                         # Sydney
longitude = 151.21

[phonebook]                               # the only people the agent can call or text (name,number CSV)
# path = "..."                            # default: phonebook.csv in the home folder
