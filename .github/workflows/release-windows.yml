name: Windows release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[stt,dev]" piper-tts pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Version matches tag
        shell: bash
        run: test "v$(python -m telefony_app.main --version)" = "${GITHUB_REF_NAME}"
      - name: Build
        run: python packaging/build_windows.py
      - name: Smoke test
        shell: bash
        run: |
          test "$(dist/telefony-app/telefony-app.exe --version)" = "${GITHUB_REF_NAME#v}"
          dist/telefony-app/piper/piper.exe --help > /dev/null
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/telefony-app-win64.zip dist/telefony-app-win64.zip.sha256 \
            --title "telefony-app $GITHUB_REF_NAME" --prerelease \
            --notes "Windows build. Unzip and run telefony-app/telefony-app.exe <telefony.toml>. In development; YMMV."
